# See https://fly.io/docs/app-guides/continuous-deployment-with-github-actions/

name: Fly Deploy
on:
  push:
    branches:
      - main
jobs:
  check:
    uses: ./.github/workflows/ci.yml
  deploy:
    name: Deploy app
    needs: check
    runs-on: ubuntu-latest
    concurrency: deploy-group    # optional: ensure only one action runs at a time
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
      - run: bun install --frozen-lockfile
      # Deploy Convex functions first so the app never runs against an older backend.
      - run: npx convex deploy
        env:
          CONVEX_DEPLOY_KEY: ${{ secrets.CONVEX_DEPLOY_KEY }}
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - run: >-
          flyctl deploy --remote-only
          --build-arg VITE_CONVEX_URL="$VITE_CONVEX_URL"
          --build-arg VITE_PAYPAL_CLIENT_ID="$VITE_PAYPAL_CLIENT_ID"
          --build-arg VITE_PAYPAL_ENV="$VITE_PAYPAL_ENV"
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
          VITE_CONVEX_URL: ${{ vars.VITE_CONVEX_URL }}
          VITE_PAYPAL_CLIENT_ID: ${{ vars.VITE_PAYPAL_CLIENT_ID }}
          VITE_PAYPAL_ENV: ${{ vars.VITE_PAYPAL_ENV }}
